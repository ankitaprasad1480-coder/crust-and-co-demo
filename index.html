<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crust & Co. – Pizzeria App</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#e4d3b0;--bg:#f6ecd9;--card:#fffaf0;--ink:#3b2a1f;--mut:#8a7660;--red:#d6452b;--grn:#4f7a3a;--gold:#e3a53a;--line:#e8d8b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b1410}}
:root[data-theme="dark"]{--page:#1b1410}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#phone{position:relative;width:min(420px,100%);height:min(860px,100%);background:radial-gradient(#e6d5b5 1px,transparent 1.5px) 0 0/16px 16px,var(--bg);overflow:hidden;display:flex;flex-direction:column;border-radius:26px;box-shadow:0 18px 50px #0004}
@media(max-width:440px){#phone{border-radius:0}}
.awn{height:22px;flex:none;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fffaf0 28px 56px);position:relative;z-index:3}
.awn:after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 14px 0,var(--red) 14px,transparent 15px) 0 0/56px 12px,radial-gradient(circle at 42px 0,#fffaf0 14px,transparent 15px) 0 0/56px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 4px}
header b{font-family:Fraunces,Georgia,serif;font-size:20px;display:flex;align-items:center;gap:8px}
header svg{width:30px;height:30px}
.pts{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700}
main{flex:1;overflow:auto;padding:6px 16px 96px;position:relative}
h1{font-family:Fraunces,Georgia,serif;font-size:26px;margin:6px 0}
h1 em,h3 em{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;background:#e9d9b8;border-radius:20px;padding:3px}.seg.wide{display:flex}.seg.wide button{flex:1}
.seg button{padding:6px 13px;border-radius:16px;font-size:13px;font-weight:600;color:var(--mut)}
.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 11px;font-size:12px;color:var(--mut)}
.chips .on{background:var(--red);border-color:var(--red);color:#fff}
.chips button:disabled{opacity:.35}
.in,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;color:var(--ink);margin:4px 0}
.hero{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff3d6,#f7dcae);border:1px solid var(--line);border-radius:20px;padding:14px;margin:8px 0;overflow:hidden}
.hero svg{width:120px;flex:none;animation:spin 40s linear infinite;margin:-6px -26px -6px 0;filter:drop-shadow(0 6px 6px #0003)}
.hero h2{font-family:Fraunces,Georgia,serif;margin:0 0 4px;font-size:20px;line-height:1.15}
.hero p{margin:0 0 8px;font-size:12px;color:var(--mut)}
.pill{display:inline-block;background:var(--red);color:#fff;border-radius:18px;padding:7px 13px;font-size:12px;font-weight:700}
.offers{display:flex;gap:8px;overflow:auto;margin:8px -16px;padding:0 16px}
.offers button{flex:none;background:var(--card);border:1.5px dashed var(--gold);border-radius:12px;padding:8px 12px;text-align:left;font-size:11px;color:var(--mut)}
.offers b{display:block;color:var(--red);font-size:13px}
.card{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0;box-shadow:0 2px 6px #5a3a1214}
.th{width:68px;flex:none}.th svg{width:100%;display:block;filter:drop-shadow(0 3px 3px #0003)}
.card .t{flex:1;min-width:0}.card b{font-size:14px}.card p{margin:2px 0 4px;font-size:11.5px;color:var(--mut)}
.pr{font-weight:700;color:var(--red);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lk{font-size:11px;color:var(--grn);font-weight:600}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.fv{font-size:20px;color:#d9c6a2}.fv.on{color:var(--red)}
.add{background:var(--red);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border:1.5px solid var(--grn);margin-right:5px;position:relative}
.dot:after{content:"";position:absolute;inset:1.5px;background:var(--grn);border-radius:50%}
.dot.nv{border-color:var(--red)}.dot.nv:after{background:var(--red)}
.crust{fill:var(--crust,#f0d3a0);transition:fill 1.2s}
.stage{position:relative;width:240px;height:240px;margin:12px auto}
.pz{position:absolute;inset:0;transform:scale(var(--s,1));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.stage{--s:1}.pz svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 8px #0004);transition:filter .6s}
#cr,#sc{transform-box:fill-box;transform-origin:center;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.pz.hot svg{filter:drop-shadow(0 0 14px #ff7a1a)}
.pz.baked{--crust:#d79a4f}.pz.baked svg{filter:brightness(.95) saturate(1.2) drop-shadow(0 8px 8px #0004)}
.pop,.drop{animation:pop .35s ease-out}
.drop{animation:drop .4s ease-out}
@keyframes pop{from{opacity:0}}@keyframes drop{from{opacity:0;transform:translateY(-28px)}}
.cut{stroke:#5a3217;stroke-width:1.4;stroke-dasharray:100;stroke-dashoffset:100;animation:cutl .8s forwards}
@keyframes cutl{to{stroke-dashoffset:0}}
.fire{position:absolute;inset:-18px;border-radius:50%;opacity:0;transition:opacity .4s;background:conic-gradient(#ff3d00,#ffc400,#ff6a00,#ffd54a,#ff3d00);filter:blur(9px);-webkit-mask:radial-gradient(circle,transparent 56%,#000 66%);mask:radial-gradient(circle,transparent 56%,#000 66%);animation:spin 1.3s linear infinite}
.fire.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.emb{position:absolute;inset:0;pointer-events:none}
.emb span{position:absolute;bottom:10%;left:var(--x);width:4px;height:4px;border-radius:50%;background:#ff9a2e;opacity:0}
.emb.on span{animation:up 1.4s linear infinite var(--d)}
.emb.st span{background:#fff;filter:blur(2.5px);width:9px;height:9px;animation-duration:2.6s}
@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-150px)}}
#hint{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 8px;min-height:18px;font-weight:600}
.steps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.steps span{font-size:10px;padding:3px 8px;border-radius:10px;background:#e9d9b8;color:var(--mut)}
.steps .on{background:var(--gold);color:#fff}.steps .done{background:var(--grn);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px}
.chip{position:relative;text-align:center;font-size:10.5px;color:var(--mut);touch-action:none;user-select:none;cursor:grab}
.chip svg{width:46px;height:46px;border-radius:50%;background:var(--card);padding:8px;border:2px solid var(--line);display:block;margin:0 auto 3px}
.chip.has svg{border-color:var(--red)}
.bd{display:none;position:absolute;top:-3px;right:6px;background:var(--red);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10px;font-weight:700;line-height:18px}
.chip.has .bd{display:block}
.ghost{position:absolute;width:40px;height:40px;z-index:9;pointer-events:none;display:none;background:#fff8;border-radius:50%}
.cta{position:sticky;bottom:0;width:100%;margin-top:14px;height:54px;border-radius:27px;background:linear-gradient(90deg,var(--red),#e8683a);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-weight:700;font-size:16px;overflow:hidden;box-shadow:0 6px 18px #d6452b55}
.cta>*{position:relative}.cta i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff40}
.cta u{text-decoration:none;font-size:12px;margin-right:8px}
.cta.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--red);box-shadow:none;justify-content:center;margin-top:10px;position:static}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.sec h3{margin:0 0 8px;font-size:15px;font-family:Fraunces,Georgia,serif}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border-radius:50%;background:#e9d9b8}
.sum div{display:flex;justify-content:space-between;margin:5px 0;font-size:13px}
.ok{color:var(--grn)}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fffaf0ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font-size:11px;color:var(--mut);padding:4px;position:relative}
nav span{display:block;font-size:19px}nav .on{color:var(--red);font-weight:700}
#bd{position:absolute;top:-2px;margin-left:2px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-style:normal}
#toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:40;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#sheet{position:absolute;inset:0;background:#2a1a0e88;display:none;align-items:flex-end;z-index:30}
#sheet.on{display:flex}
.sh{background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px 20px;width:100%;max-height:92%;overflow:auto;animation:sl .3s ease-out}
@keyframes sl{from{transform:translateY(100%)}}
.sh h3{margin:0 0 10px;font-family:Fraunces,Georgia,serif}.sh small{display:block;font-family:Inter;font-size:11px;color:var(--mut);font-weight:400}
.apps{display:flex;gap:8px;margin:8px 0}.apps button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600}.apps .on{border-color:var(--red);background:#fdebe4}
.c2{display:flex;gap:8px}
.big{text-align:center;padding:30px 10px}.big .tick{font-size:56px;animation:pop2 .5s}
@keyframes pop2{from{transform:scale(0)}}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
.tl{margin:6px 0}.tl div{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--mut);font-size:14px;position:relative}
.tl div:before{content:"";width:16px;height:16px;border-radius:50%;background:#e9d9b8;flex:none}
.tl .d{color:var(--ink)}.tl .d:before{background:var(--grn)}.tl .a{color:var(--red);font-weight:700}.tl .a:before{background:var(--gold);box-shadow:0 0 0 5px #e3a53a44;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px #e3a53a11}}
.road{position:relative;height:30px;border-bottom:3px dashed #c9b48c;margin:8px 0}
.road span{position:absolute;bottom:-4px;font-size:26px;animation:ride 5s linear infinite}
@keyframes ride{from{left:0}to{left:calc(100% - 30px)}}
.stars button{font-size:26px;color:#d9c6a2}.stars .on{color:var(--gold)}
textarea.in{min-height:70px}
.empty{text-align:center;color:var(--mut);margin-top:60px}
.ln{flex-wrap:wrap}
.lks{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}.lk.rm{color:var(--red)}
.ed{flex:0 0 100%;border-top:1px dashed var(--line);margin-top:2px;padding-top:6px}
.tr{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:7px 0}
.tr small{color:var(--grn);font-weight:600;margin-left:6px;font-size:11px}
.qty button:disabled{opacity:.3;cursor:default}
.tg{font-size:12px;font-weight:600;border:1.5px solid var(--line);border-radius:14px;padding:5px 11px;background:var(--bg);color:var(--grn)}
.tg.rm{color:var(--red);border-color:var(--red)}
.note{font-size:11px;color:var(--mut);margin:2px 0 4px}
.was{color:var(--mut);text-decoration:line-through;font-weight:400;font-size:12px}
.undo{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;font-size:13px;margin:8px 0}
.undo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}.undo button{color:var(--gold);font-weight:700}
</style></head><body>
<div id="phone">
<div class="awn"></div>
<header><b id="logo"></b><span class="pts" id="pts"></span></header>
<main id="main"></main>
<nav><button data-t="menu"><span>🍕</span>Menu</button><button data-t="make"><span>👩‍🍳</span>Make it</button><button data-t="cart"><span>🛒</span>Cart<i id="bd" hidden>0</i></button><button data-t="track"><span>🛵</span>Track</button></nav>
<div id="sheet"></div><div id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms)),rnd=Math.random;
const SL=['S','M','L'],SN=['Regular','Medium','Large'];
const T={cheese:['Mozzarella','c'],olive:['Olives','v'],onion:['Onion','v'],pepper:['Capsicum','v'],paneer:['Paneer','v'],mush:['Mushroom','v'],corn:['Golden corn','v'],tomato:['Tomato','v'],jala:['Jalapeño','v'],sausage:['Sausage','n'],tikka:['Chicken tikka','n'],bbq:['BBQ chicken','n']};
const TP={c:[50,75,95],v:[35,60,80],n:[50,75,95]},BASE=[109,239,449],EC=[50,75,95];
const CR=[['Classic',[0,0]],['Wheat thin',[45,65]],['Fresh pan',[45,55]],['Cheese burst',[95,119]]];
const D={veg:[['Margherita','Cheesy classic',[109,239,449],'cheese'],['Achari Do Pyaza','Tangy achari onion, super cheesy',[179,329,549],'cheese,onion,onion'],['Double Cheese Margherita','Loaded with extra cheese',[209,379,609],'cheese,cheese'],['Fresh Veggie','Onion & capsicum, a veggie lover’s pick',[209,379,609],'cheese,onion,pepper'],['Cheese N Corn','Sweet golden corn & mozzarella',[209,379,609],'cheese,corn'],['Farmhouse','Onion, capsicum, tomato, mushroom',[259,459,689],'cheese,onion,pepper,tomato,mush'],['Peppy Paneer','Juicy paneer, capsicum, red paprika',[259,459,689],'cheese,paneer,pepper'],['Paneer Makhani','Makhani sauce, paneer & capsicum',[299,549,799],'cheese,paneer,pepper'],['Veg Extravaganza','Olives, onion, mushroom, corn, jalapeño',[299,549,799],'cheese,olive,onion,mush,corn,jala'],['Cheese Overload','1 pound of mozzarella, 4 cheeses',[349,639,959],'cheese,cheese,cheese']],
nv:[['Chicken Sausage','Chicken sausage & cheese',[199,369,599],'cheese,sausage'],['Pepper Barbecue Chicken','Barbecue chicken with extra zing',[249,449,669],'cheese,bbq'],['Pepper Barbecue & Onion','Barbecue chicken & onion',[279,499,739],'cheese,bbq,onion'],['Chicken Golden Delight','Barbecue chicken, golden corn',[309,559,829],'cheese,bbq,corn'],['Chicken Fiesta','Chicken rashers, peri-peri, capsicum',[309,559,829],'cheese,tikka,onion,pepper'],['Chicken Pepperoni','Classic with extra cheese',[359,599,919],'cheese,sausage,sausage'],['Non Veg Supreme','Tikka, rashers, mushroom, olives',[359,599,919],'cheese,tikka,sausage,mush,olive,pepper'],['Chicken Maximus','Tikka, keema, sausage & rashers',[399,699,1029],'cheese,tikka,sausage,bbq']],
par:[['Corn N Cheese Paratha Pizza','Corn-stuffed paratha & cheesy pizza',[179],'cheese,corn'],['Paneer Paratha Pizza','Paratha, melting cheese & paneer',[209],'cheese,paneer'],['Chicken Keema Paratha Pizza','Meaty keema paratha & cheese',[249],'cheese,tikka',1]],
mania:[['Classic','Everyday value pizza',[49],'cheese'],['Tomato','Fresh tomato & cheese',[59],'cheese,tomato'],['Onion','Crunchy onion & cheese',[69],'cheese,onion'],['Golden Corn','Sweet corn & cheese',[89],'cheese,corn'],['Cheesy','Extra cheesy',[109],'cheese,cheese'],['Paneer, Onion & Capsicum','Paneer, onion, capsicum',[129],'cheese,paneer,onion,pepper'],['Veg Loaded','Olives, mushroom, corn, capsicum',[159],'cheese,olive,mush,corn,pepper'],['Mania Chicken Sausage','Chicken sausage',[109],'cheese,sausage',1],['Mania Pepper Barbecue','Pepper barbecue chicken',[119],'cheese,bbq',1],['Non Veg Loaded','Tikka, sausage & barbecue',[169],'cheese,tikka,sausage,bbq',1]]};
const CATN={veg:'Veg',nv:'Non-Veg',par:'Paratha',mania:'Mania',fav:'♥ Faves'};
const ALL=[];for(const c in D)D[c].forEach(d=>ALL.push({k:ALL.length,c,n:d[0],ds:d[1],p:d[2],t:d[3],nv:c=='nv'||d[4]==1,reg:c=='par'||c=='mania'}));
let size=2,crust=0,xc=false,tab='menu',cat='veg',q='',veg=false,favs=new Set(),tops={},pcs={},fired=false,firing=false,cart=[],uid=0,ed=null,lastDel=null,mode='watch',sel=5,run=0,dm='del',pm='upi',app='',cp='',tip=0,pts=0,ord=null,f={slot:'ASAP · 15 min',store:'Main Street Outlet'},fb={food:0,svc:0,tags:[]};
function sh(id,x,y,r){const m={cheese:'<ellipse rx="7" ry="3.5" fill="#fff3d0" stroke="#f1d79a" stroke-width=".6"/>',olive:'<circle r="4.6" fill="none" stroke="#1d1d26" stroke-width="2.6"/>',onion:'<circle r="6" fill="none" stroke="#c4a9ee" stroke-width="2"/>',pepper:'<rect x="-1.8" y="-7" width="3.6" height="14" rx="1.8" fill="#5fae3a"/>',paneer:'<rect x="-4.5" y="-4.5" width="9" height="9" rx="1.5" fill="#ffe7a1" stroke="#e8bd5c" stroke-width=".8"/>',mush:'<path d="M-6 1a6 5 0 0112 0z" fill="#eadfce"/><rect x="-2" y="1" width="4" height="4" fill="#d9cbb5"/>',corn:'<circle r="2.6" fill="#f7c826"/>',tomato:'<circle r="5.5" fill="#e63c2c" stroke="#a8251a" stroke-width="1"/><circle r="1.5" fill="#ffd4a8"/>',jala:'<circle r="4.5" fill="#6fae3b" stroke="#3b7a1d" stroke-width="1"/><circle r="1.3" fill="#d7f0b0"/>',sausage:'<circle r="6" fill="#c1553a" stroke="#8c3622" stroke-width="1"/><circle cx="-2" cy="-1" r="1" fill="#8c3622"/><circle cx="2" cy="2" r="1" fill="#8c3622"/>',tikka:'<rect x="-5.5" y="-4" width="11" height="8" rx="3" fill="#d08a45" stroke="#8f5622" stroke-width="1"/>',bbq:'<rect x="-5.5" y="-4" width="11" height="8" rx="3" fill="#8b4a2a" stroke="#4e2614" stroke-width="1"/><rect x="-3" y="-1" width="6" height="1.8" fill="#9fcf6a"/>'};return `<g transform="translate(${x} ${y}) rotate(${r})">${m[id]}</g>`}
function pz(t,seed){let s=seed*7919+13;const r=()=>(s=(s*9301+49297)%233280)/233280;let h='<circle class="crust" cx="100" cy="100" r="97"/><circle cx="100" cy="100" r="82" fill="#d63a2a"/>';t.split(',').forEach(id=>{for(let i=0;i<(id=='cheese'?9:6);i++){const g=r()*6.28,d=Math.sqrt(r())*68;h+=sh(id,100+Math.cos(g)*d,100+Math.sin(g)*d,r()*360)}});return `<svg viewBox="0 0 200 200">${h}</svg>`}
const ec=()=>size<2?CR[crust][1][size]:0;
const ipr=a=>a.reg?a.p[0]:a.p[size]+ec()+(xc?EC[size]:0);
const typ=id=>T[id][1];
const calc=()=>BASE[size]+ec()+Object.entries(tops).reduce((s,[id,n])=>s+n*TP[typ(id)][size],0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1700)}
const segH=()=>SL.map((l,i)=>`<button class="${i==size?'on':''}" data-a="size" data-v="${i}">${SN[i]}</button>`).join('');
const crH=()=>CR.map((c,i)=>`<button class="${i==(size<2?crust:0)?'on':''}" data-a="crust" data-v="${i}" ${size==2&&i?'disabled':''}>${c[0]}${size<2&&c[1][size]?' +₹'+c[1][size]:''}</button>`).join('');
